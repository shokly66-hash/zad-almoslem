<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<meta name="description" content="زاد المسلم - أسئلة إسلامية وفوائد موثوقة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>زاد المسلم</title>
<style>
:root{--green:#123d32;--mint:#16865e;--gold:#d7bd79;--bg:#f5f7f4;--ink:#1d2b25;--muted:#68756d;--line:#dfe7e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:620px;margin:auto;padding:16px}
header{background:linear-gradient(135deg,#123d32,#205746);color:white;border-radius:22px;padding:22px 20px;margin:4px 0 16px}
h1{margin:0;font-size:27px}header p{margin:7px 0 0;color:#e7e1cc;font-size:14px}
.pills{display:flex;gap:8px;margin-bottom:14px}.pills button{flex:1}
button{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);padding:12px 14px;border-radius:13px;cursor:pointer}
button.primary{background:var(--mint);color:white;border-color:var(--mint);font-weight:700}
button.active{background:#e4f1e9;border-color:var(--mint);color:#12563c}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #173d3010}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{font-size:13px;color:var(--muted)}.category{color:var(--mint);font-weight:700;font-size:13px}
h2{font-size:21px;line-height:1.6;margin:12px 0}
.answers{display:grid;gap:9px}.answers button{text-align:right;line-height:1.5}
.answers button.chosen{border:2px solid var(--mint);background:#eef7f1}
.answers button.correct{border:2px solid #16865e;background:#eaf6ee}
.answers button.wrong{border:2px solid #c65b51;background:#fff0ee}
.note{background:#f2f6f2;border-radius:13px;padding:13px;line-height:1.8;margin-top:13px}
.hidden{display:none}.score{font-weight:700;color:var(--mint)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.progress{height:7px;background:#e7ece8;border-radius:9px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--mint)}
</style>
</head>
<body>
<main>
<header><div class="row"><h1>زاد المسلم</h1><span style="font-size:28px;color:var(--gold)">۞</span></div><p>كل سؤال معرفة، وكل إجابة فائدة</p></header>
<div class="pills">
<button id="quizTab" class="active">المسابقة</button>
<button id="learnTab">التعلّم</button>
</div>
<section class="card" id="game">
<div class="row"><span class="category" id="category"></span><span class="small" id="counter"></span></div>
<div class="progress"><span id="bar" style="width:20%"></span></div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
<div id="feedback" class="note hidden" aria-live="polite"></div>
<div class="row" style="margin-top:15px">
<span class="small" id="points">النقاط: 0</span>
<button class="primary" id="action" disabled>تأكيد الإجابة</button>
</div>
</section>
<section class="card hidden" id="result">
<h2>أحسنت! انتهت الجولة</h2><p class="score" id="finalScore"></p>
<button class="primary" id="restart">ابدأ من جديد</button>
</section>
<footer>المحتوى الأولي للتجربة. راجع المصادر قبل اعتماد أي مادة للنشر.</footer>
</main>
<script>
const questions=[
{c:"الصحابة",q:"من هو أول الخلفاء الراشدين؟",o:["عمر بن الخطاب","أبو بكر الصديق","عثمان بن عفان","علي بن أبي طالب"],a:1,e:"أبو بكر الصديق رضي الله عنه هو أول الخلفاء الراشدين.",s:"صحيح البخاري، كتاب فضائل أصحاب النبي ﷺ."},
{c:"الصحابة",q:"من الصحابي الملقب بذي النورين؟",o:["علي بن أبي طالب","عمر بن الخطاب","عثمان بن عفان","طلحة بن عبيد الله"],a:2,e:"عثمان بن عفان رضي الله عنه لُقّب بذي النورين؛ لزواجه من رقية ثم أم كلثوم ابنتي رسول الله ﷺ.",s:"كتب السيرة والتراجم."},
{c:"القرآن الكريم",q:"ما أول ما نزل من القرآن الكريم؟",o:["سورة الفاتحة","آية الكرسي","أول خمس آيات من سورة العلق","سورة الإخلاص"],a:2,e:"ورد في حديث بدء الوحي أن صدر سورة العلق كان أول ما نزل.",s:"صحيح البخاري، كتاب بدء الوحي؛ سورة العلق 1–5."},
{c:"السيرة النبوية",q:"من صاحب النبي ﷺ في الهجرة إلى المدينة؟",o:["عمر بن الخطاب","أبو بكر الصديق","عثمان بن عفان","بلال بن رباح"],a:1,e:"رافق أبو بكر الصديق رضي الله عنه النبي ﷺ في الهجرة.",s:"القرآن الكريم، سورة التوبة: 40."},
{c:"التاريخ الإسلامي",q:"في أي سنة هجرية وقعت غزوة بدر؟",o:["السنة الأولى","السنة الثانية","السنة الثالثة","السنة الخامسة"],a:1,e:"وقعت غزوة بدر الكبرى في رمضان من السنة الثانية للهجرة.",s:"كتب السيرة النبوية."}
];
let i=0,chosen=-1,score=0,submitted=false,mode="quiz";
const $=id=>document.getElementById(id);
function render(){
 const q=questions[i];$("category").textContent=q.c;$("counter").textContent=`${i+1} / ${questions.length}`;
 $("bar").style.width=((i+1)/questions.length*100)+"%";$("question").textContent=q.q;
 $("answers").innerHTML="";
 q.o.forEach((v,n)=>{const b=document.createElement("button");b.textContent=v;if(chosen===n)b.classList.add("chosen");
 if(submitted&&n===q.a)b.classList.add("correct");if(submitted&&chosen===n&&n!==q.a)b.classList.add("wrong");
 b.disabled=submitted;b.onclick=()=>{chosen=n;render()};$("answers").appendChild(b)});
 $("points").textContent="النقاط: "+score;
 $("feedback").classList.toggle("hidden",!submitted);
 if(submitted)$("feedback").textContent=(chosen===q.a?"إجابة صحيحة! ":"الإجابة الصحيحة: "+q.o[q.a]+". ")+q.e+" المصدر: "+q.s;
 $("action").disabled=chosen<0&&!submitted;
 $("action").textContent=submitted?(i===questions.length-1?"عرض النتيجة":"السؤال التالي"):"تأكيد الإجابة";
}
$("action").onclick=()=>{if(!submitted){submitted=true;if(chosen===questions[i].a)score++;render()}else if(i<questions.length-1){i++;chosen=-1;submitted=false;render()}else{$("game").classList.add("hidden");$("result").classList.remove("hidden");$("finalScore").textContent=`نتيجتك: ${score} من ${questions.length}`}};
function reset(){i=0;chosen=-1;score=0;submitted=false;$("result").classList.add("hidden");$("game").classList.remove("hidden");render()}
$("restart").onclick=reset;
$("quizTab").onclick=()=>{$("quizTab").classList.add("active");$("learnTab").classList.remove("active");reset()};
$("learnTab").onclick=()=>{$("learnTab").classList.add("active");$("quizTab").classList.remove("active");reset()};
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
